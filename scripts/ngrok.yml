# Used by `npm run dev:remote` (scripts/dev.sh): puts the app and unive-v2 on
# one public address, so Expo Go works on any network.
# Your ngrok sign-in (authtoken) stays in ngrok's own config file.
version: 3
endpoints:
  # Metro serves the app's code to Expo Go. unive-v2's own addresses go on
  # to it, the way unive.ai serves them: /api/… (sign-in, chat, profile),
  # /_next/… (built images) and its public/ folders (pictures, the guide's
  # narration). Add a folder here when unive-v2's public/ gets a new one.
  - name: unive-mobile
    url: https://scepterless-darrin-subparallel.ngrok-free.dev
    upstream:
      url: 8081
    traffic_policy:
      on_http_request:
        - expressions:
            - "req.url.path.matches('^/(api|_next|about-story|about-us|affiliate-assets|audio|badges|blogs|brand|features|file-types|fonts|institutions|isomorphic-icons|knwoledge-img-seq|landing|logo|mentors|partnerships|premium|pricing|projects|quiz|reviews|scenes|scripts|section-specific|seo|seo-pages|trust-badges|tutors|unis|unis-gray|use-cases)/')"
          actions:
            - type: forward-internal
              config:
                url: https://unive-v2.internal
  # unive-v2 (Next.js), reachable only through the address above.
  - name: unive-v2
    url: https://unive-v2.internal
    upstream:
      url: 3000
